map $http_upgrade $hapi_connection_upgrade {
    default upgrade;
    "" close;
}

# HAPI can carry short-lived credentials in query strings. Log the path only.
log_format hapi_safe '$remote_addr - [$time_local] '
                     '"$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=hapi_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=hapi_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;
    server_tokens off;
    access_log /var/log/nginx/hapi-access.log hapi_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hapi-acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __PUBLIC_HOST__;
    server_tokens off;
    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;

    access_log /var/log/nginx/hapi-access.log hapi_safe;
    limit_conn hapi_per_ip 100;
    limit_conn_status 429;
    limit_req_status 429;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /api/auth {
        limit_req zone=hapi_auth burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Old clients must not reach a leftover control service or the SPA fallback.
    location = /api/control { return 404; }
    location ^~ /api/control/ { return 404; }

    location / {
        # Attachments are base64 JSON; a 50 MB file is ~67 MB on the wire.
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hapi_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

# Only __PUBLIC_HOST__ is served. Unknown TLS names fail the handshake and
# every other Host header is closed without a response.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
    return 444;
}
